name: QA CI/CD Pipeline

on:
  push:
    branches:
      - qa
    paths:
      - "client/**"
      - "server/**"
      - "k8-manifests/**"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - ".github/workflows/qa-cicd.yml"

permissions:
  contents: write
  id-token: write

jobs:
  detect-capabilities:
    name: Detect repository capabilities
    runs-on: ubuntu-latest
    outputs:
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
      has_qa_manifest: ${{ steps.detect.outputs.has_qa_manifest }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Detect Dockerfile and QA manifest
        id: detect
        run: |
          if find . -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) | grep -q .; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "k8-manifests/qa/app-deployment.yaml" ]; then
            echo "has_qa_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_qa_manifest=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks-scan:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Gitleaks scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  checkov-scan:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov scan
        run: |
          checkov -d . \
            --framework terraform,kubernetes,dockerfile \
            --output json > checkov-report.json || true

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json
          if-no-files-found: warn

  trivy-fs-scan:
    name: Trivy FS scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    strategy:
      fail-fast: false
      matrix:
        component: [client, server]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Run Trivy FS scan (JSON)
        run: |
          trivy fs ./${{ matrix.component }} \
            --format json \
            --output ${{ matrix.component }}-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-trivy-fs-report
          path: ${{ matrix.component }}-trivy-fs-report.json
          if-no-files-found: warn

  app-checks:
    name: App checks (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs:
      - checkov-scan
      - trivy-fs-scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            run_build: true
          - component: server
            run_build: false
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect available scripts
        id: scripts
        run: |
          node -e "const fs=require('fs');const s=(require('./package.json').scripts)||{};fs.appendFileSync(process.env.GITHUB_OUTPUT,`has_lint=${Boolean(s.lint)}\\nhas_test=${Boolean(s.test)}\\nhas_build=${Boolean(s.build)}\\n`);"

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test

      - name: Build client
        if: matrix.run_build && steps.scripts.outputs.has_build == 'true'
        run: npm run build

  docker-build-scan-push:
    name: Docker build, scan and push
    runs-on: ubuntu-latest
    needs:
      - detect-capabilities
      - app-checks
    if: needs.detect-capabilities.outputs.has_dockerfile == 'true'
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/nodejs-app', vars.DOCKERHUB_USERNAME) || 'devopsshack/nodejs-app' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          load: true
          push: false
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Run Trivy image scan (JSON)
        run: |
          trivy image ${{ env.IMAGE_REPO }}:${{ github.sha }} \
            --format json \
            --output image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-report
          path: image-trivy-report.json
          if-no-files-found: warn

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

  update-qa-manifest:
    name: Update QA manifest
    runs-on: ubuntu-latest
    needs:
      - detect-capabilities
      - docker-build-scan-push
    if: needs.detect-capabilities.outputs.has_qa_manifest == 'true'
    env:
      IMAGE_REPO: ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/nodejs-app', vars.DOCKERHUB_USERNAME) || 'devopsshack/nodejs-app' }}
    steps:
      - name: Checkout qa branch
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*/nodejs-app:.*|image: ${{ env.IMAGE_REPO }}:${GITHUB_SHA}|g" k8-manifests/qa/app-deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8-manifests/qa/app-deployment.yaml
          git commit -m "Update QA image to ${GITHUB_SHA} [skip ci]" || echo "No changes to commit"
          git push origin qa

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - detect-capabilities
      - update-qa-manifest
    if: needs.detect-capabilities.outputs.has_qa_manifest == 'true' && secrets.AWS_ROLE_TO_ASSUME != ''
    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: my-cluster
      K8S_NAMESPACE: qa
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: qa

      - name: Configure AWS credentials from GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate kubeconfig for EKS
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Deploy manifests
        run: kubectl apply -f k8-manifests/qa/ -n "${K8S_NAMESPACE}"

      - name: Verify rollout
        run: kubectl rollout status deployment/nodejs-app -n "${K8S_NAMESPACE}" --timeout=180s
