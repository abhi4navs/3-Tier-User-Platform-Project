name: Enterprise DevSecOps CICD Pipeline

on:
  push:
    branches:
      - qa
    paths:
      - "client/**"
      - "server/**"
      - "k8-manifests/**"
      - "Dockerfile"
      - ".github/workflows/qa-cicd.yml"
      - "sonar-project.properties"

permissions:
  contents: write
  id-token: write

jobs:

  # ============================================================
  # 1. GITLEAKS
  # ============================================================

  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn


  # ============================================================
  # 2. CHECKOV - TERRAFORM
  # ============================================================

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Terraform Scan
        run: |
          checkov -d . \
            --framework terraform \
            --output json > checkov-terraform-report.json || true

      - name: Upload Checkov Terraform Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn


  # ============================================================
  # 3. CHECKOV - KUBERNETES
  # ============================================================

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Kubernetes Scan
        run: |
          checkov -d k8-manifests \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true

      - name: Upload Checkov Kubernetes Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn


  # ============================================================
  # 4. CHECKOV - DOCKERFILE
  # ============================================================

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Dockerfile Scan
        run: |
          checkov -f Dockerfile \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true

      - name: Upload Checkov Dockerfile Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn


  # ============================================================
  # 5. CLIENT TRIVY FILESYSTEM SCAN
  # ============================================================

  client-trivy-fs:
    name: Client Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy
        run: |
          trivy --version
          which trivy

      - name: Run Trivy Client FS Scan - JSON
        run: |
          trivy fs ./client \
            --format json \
            --output client-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy Client FS Scan - TABLE
        run: |
          trivy fs ./client \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > client-trivy-fs-report.txt

      - name: Upload Client Trivy JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-json-report
          path: client-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Client Trivy Table Report
        uses: actions/upload-artifact@v4
        with:
          name: client-trivy-fs-table-report
          path: client-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # 6. SERVER TRIVY FILESYSTEM SCAN
  # ============================================================

  server-trivy-fs:
    name: Server Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy
        run: |
          trivy --version
          which trivy

      - name: Run Trivy Server FS Scan - JSON
        run: |
          trivy fs ./server \
            --format json \
            --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Run Trivy Server FS Scan - TABLE
        run: |
          trivy fs ./server \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > server-trivy-fs-report.txt

      - name: Upload Server Trivy JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-json-report
          path: server-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload Server Trivy Table Report
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-table-report
          path: server-trivy-fs-report.txt
          if-no-files-found: warn


  # ============================================================
  # 7. CLIENT LINT
  # ============================================================

  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest

    needs:
      - client-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Client Lint
        run: npm run lint --if-present


  # ============================================================
  # 8. SERVER LINT
  # ============================================================

  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest

    needs:
      - server-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Server Lint
        run: npm run lint --if-present


  # ============================================================
  # 9. CLIENT TEST
  # ============================================================

  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: client-lint

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Client Tests
        run: npm test --if-present


  # ============================================================
  # 10. SERVER TEST
  # ============================================================

  server-test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: server-lint

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Server Tests
        run: npm test --if-present


  # ============================================================
  # 11. SONARQUBE
  # ============================================================

  sonarqube:
    name: SonarQube Analysis & Quality Gate
    runs-on: ubuntu-latest

    needs:
      - client-test
      - server-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 12. CLIENT BUILD
  # ============================================================

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    needs:
      - client-test
      - sonarqube

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Client
        run: npm run build --if-present


  # ============================================================
  # 13. DOCKER BUILD + TRIVY + SBOM + PUSH
  # ============================================================

  docker:
    name: Docker Build, Security Scan & Push
    runs-on: ubuntu-latest

    needs:
      - client-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            devopsshack/nodejs-app:${{ github.sha }}
            devopsshack/nodejs-app:latest

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy
        run: |
          trivy --version
          which trivy

      - name: Trivy Docker Image Scan - JSON
        run: |
          trivy image \
            devopsshack/nodejs-app:${{ github.sha }} \
            --format json \
            --output image-trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

      - name: Trivy Docker Image Scan - TABLE
        run: |
          trivy image \
            devopsshack/nodejs-app:${{ github.sha }} \
            --format table \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 > image-trivy-report.txt

      - name: Upload Image Trivy JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-json-report
          path: image-trivy-report.json
          if-no-files-found: warn

      - name: Upload Image Trivy Table Report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-table-report
          path: image-trivy-report.txt
          if-no-files-found: warn

      - name: Generate Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: source-sbom.spdx.json
          upload-artifact: true

      - name: Generate Image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: devopsshack/nodejs-app:${{ github.sha }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: true

      - name: Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            devopsshack/nodejs-app:${{ github.sha }}
            devopsshack/nodejs-app:latest


  # ============================================================
  # 14. UPDATE QA MANIFEST
  # ============================================================

  update-qa-manifest:
    name: Update QA Manifest
    runs-on: ubuntu-latest

    needs:
      - docker

    permissions:
      contents: write

    steps:
      - name: Checkout QA Branch
        uses: actions/checkout@v4
        with:
          ref: qa
          fetch-depth: 0

      - name: Update Image Tag
        run: |
          sed -i \
            "s|image: devopsshack/nodejs-app:.*|image: devopsshack/nodejs-app:${GITHUB_SHA}|g" \
            k8-manifests/qa/app-deployment.yaml

      - name: Show Updated Manifest
        run: |
          cat k8-manifests/qa/app-deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8-manifests/qa/app-deployment.yaml

          git commit \
            -m "Update QA image to ${GITHUB_SHA} [skip ci]" \
            || echo "No changes to commit"

          git push origin qa


  # ============================================================
  # 15. DEPLOY TO AWS EKS
  # ============================================================

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - update-qa-manifest

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: my-cluster
      K8S_NAMESPACE: qa

    steps:
      - name: Checkout Latest QA Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: qa
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Generate EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
          kubectl config current-context

      - name: Verify Kubernetes Access
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get services -n "${K8S_NAMESPACE}"

          kubectl auth can-i create deployments \
            -n "${K8S_NAMESPACE}"

          kubectl auth can-i create services \
            -n "${K8S_NAMESPACE}"

          kubectl auth can-i create ingresses.networking.k8s.io \
            -n "${K8S_NAMESPACE}"

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply \
            -f k8-manifests/qa/ \
            -n "${K8S_NAMESPACE}"

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status \
            deployment/nodejs-app \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s
